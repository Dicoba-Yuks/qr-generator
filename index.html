<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL to QR Code Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 380px;
      }
      h2 {
        color: #333;
        margin-bottom: 5px;
      }
      p {
        color: #666;
        font-size: 13px;
        margin-bottom: 20px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 15px;
        outline: none;
        transition: border-color 0.3s;
      }
      input[type="text"]:focus {
        border-color: #3498db;
      }
      button {
        background-color: #3498db;
        color: white;
        border: none;
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #2980b9;
      }
      .qr-container {
        margin-top: 20px;
        display: none;
      }
      canvas {
        margin-bottom: 15px;
        border: 4px solid #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .download-btn {
        background-color: #2ecc71;
        text-decoration: none;
        display: inline-block;
        padding: 10px;
        color: white;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        width: 100%;
        box-sizing: border-box;
      }
      .download-btn:hover {
        background-color: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>QR Code Generator</h2>
      <p>Ubah URL atau teks menjadi QR Code secara instan & offline.</p>

      <input
        type="text"
        id="urlInput"
        placeholder="Masukkan URL (cth: https://google.com)"
      />
      <button id="generateBtn">Buat QR Code</button>

      <div class="qr-container" id="qrContainer">
        <canvas id="qrCanvas"></canvas>
        <br />
        <a id="downloadLink" class="download-btn" download="qrcode.png"
          >Download QR Code</a
        >
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
